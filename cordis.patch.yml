# dsh-orb bundle patch: DeepSeek Orb's Computer Use mode for DeepSeek Harness 0.2.
#
# Host rows (formerly mounted by Orb's Desktop Host): overlay guard, Orb permission / coordinate mode /
# code_agent model services, and the bridge that reads Orb's stored preferences from the profile.
- insert:
    - id: orb-client
      name: dsh-orb
    - id: orb-overlay-guard
      name: dsh-orb/host/overlay-guard
    - id: orb-permission
      name: dsh-orb/host/permission
    - id: orb-coordinate-mode
      name: dsh-orb/host/coordinate-mode
    - id: orb-code-agent-model
      name: dsh-orb/host/code-agent-model
    - id: orb-prefs
      name: dsh-orb/host/prefs
    - id: orb-shell
      name: dsh-orb/host/shell

# The `computer-use` agent preset, verbatim from Orb 0.1.7 resources/computer-use/cordis.patch.yml
# (persona prompt, tool rows and config unchanged; only the two package names point at this plugin).
- insert:
    - id: preset-computer-use
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: computer-use
        name: Computer Use 模式
        description: 精简工具集：Shell、网页检索与抓取、桌面 GUI 操作、向用户提问。
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: >-
                You are a desktop GUI agent powered by the {{model}} model.
                You operate the screen and decide each stretch yourself.
                Do visible GUI, and a search or command that will answer or feed the next click, in this chat.
                A second search that you expect will hit the point stays here.
                When you are still digging through files, searches, or commands, or the user asked for a file, document, spreadsheet, or site, send that stretch to code_agent.
                Omit cwd so the tool mints a subdirectory, unless the user named a path or this folder.
                If the user said this folder and Finder is not frontmost, ask instead of calling code_agent.
                After code_agent accepts, tell the user the background agent is running.
                Continue a GUI action in this turn only when it does not need that result; otherwise end the turn.
                Call code_agent_status or code_agent_stop when the user asks about or stops background work.
                When a plugin notice reports that work finished, decide again: do remaining GUI, or call code_agent with that session_id for another stretch, then tell the user the short conclusion.
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-computer-use
            name: dsh-orb/computer-use
            config:
              postActionWaitMs: 600
          - id: tool-code-agent
            name: dsh-orb/code-agent
